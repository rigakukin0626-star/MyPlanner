<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>My Planner · Market chart</title>
<style>
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#f7f9fd;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
body.dark{background:#121823;color:#fff}
#chart,.tradingview-widget-container,.tradingview-widget-container__widget{height:100%;width:100%;min-height:0}
#fallback{position:absolute;inset:auto 10px 10px;padding:11px;text-align:center;border-radius:12px;background:#edf3ff;color:#344960;font-size:12px;display:none}
#fallback a{color:#2868bf}
</style></head><body>
<div id="chart"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
{"autosize":true,"symbol":"TSE:1570","interval":"D","timezone":"Asia/Tokyo","theme":"light","style":"1","locale":"zh_CN","allow_symbol_change":false,"hide_top_toolbar":false,"hide_legend":false,"save_image":false,"calendar":false,"support_host":"https://www.tradingview.com"}
</script></div></div>
<div id="fallback" role="status"></div>
<script>
(function(){
 const p=new URLSearchParams(location.search),code=String(p.get('tvwidgetsymbol')||p.get('symbol')||'').replace(/^TSE:/,'').toUpperCase();
 if(p.get('theme')==='dark')document.body.className='dark';
 const fallback=document.getElementById('fallback');
 // TradingView supports tvwidgetsymbol in the embedding document's query string.
 // Keep an external link if tracking blockers or iOS web views prevent iframe initialization.
 setTimeout(function(){
  const found=document.querySelector('.tradingview-widget-container iframe');
  if(found)return;
  const safe=/^([0-9]{4}|[0-9]{3}[A-Z])$/.test(code)?code:'1570';
  fallback.style.display='block';
  fallback.textContent='图表加载失败。';
  const a=document.createElement('a');a.href='https://www.tradingview.com/symbols/TSE-'+safe+'/';a.target='_blank';a.rel='noopener noreferrer';a.textContent=' 在 TradingView 查看 ↗';fallback.append(a);
 },9000);
})();
</script></body></html>
