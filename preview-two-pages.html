<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><title>My Planner · 双页面预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#1d2b46;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}main{max-width:680px;margin:auto;padding:24px 17px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 25px}.eyebrow{font-size:10px;letter-spacing:2px;color:#8a96aa;font-weight:800}.top h1{font-size:30px;margin:6px 0}.top p{margin:0;color:#8a96aa;font-size:13px}.avatar{border:1px solid #e1e7f1;background:white;width:44px;height:44px;border-radius:15px;font-size:21px}.card{background:#fff;border:1px solid #e6ebf3;border-radius:22px;padding:19px;margin-bottom:15px;box-shadow:0 5px 20px #25365a06}.muted{color:#8b97ab}.label{font-size:12px;color:#8390a5;font-weight:700}.hero{background:linear-gradient(125deg,#326cf0,#6796ff);color:white;padding:23px}.hero .muted{color:#e2ebff}.hero h2{font-size:27px;margin:8px 0}.bar{height:8px;background:#ffffff50;border-radius:8px;margin-top:18px}.bar i{display:block;height:100%;width:33%;background:white;border-radius:8px}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 3px 12px}.section h2{font-size:18px;margin:0}.section span{font-size:12px;color:#8795aa}.task{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid #eef1f6}.task:last-child{border:0}.check{width:23px;height:23px;border:2px solid #cbd5e4;border-radius:8px;flex-shrink:0}.task strong{font-size:15px}.task small{display:block;margin-top:5px;color:#98a4b5}.pill{margin-left:auto;background:#fff4db;color:#a77b21;padding:5px 8px;border-radius:8px;font-size:11px}.add{width:100%;border:0;background:#2866ec;color:#fff;border-radius:14px;padding:15px;font-weight:700;margin-top:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #e5eaf3;padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;backdrop-filter:blur(14px)}.nav button{border:0;background:transparent;color:#8793a9;padding:9px 35px;border-radius:13px;font-weight:700;min-width:120px}.nav button.active{background:#eaf1ff;color:#2866ec}.page{display:none}.page.active{display:block}.calendarhead{display:flex;align-items:center;justify-content:space-between}.calendarhead h2{font-size:20px}.arrows button{background:#f4f6fb;border:0;border-radius:10px;padding:8px 13px;margin-left:6px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.week{color:#9ca8ba;font-size:12px;margin:12px 0}.days{gap:5px}.day{border:0;background:transparent;min-height:43px;border-radius:12px;color:#36445e;position:relative}.day.other{color:#c8ced8}.day.selected{background:#2866ec;color:white;font-weight:800}.day.has:after{content:"";position:absolute;bottom:4px;left:calc(50% - 2px);height:4px;width:4px;background:#e4a23a;border-radius:50%}.day.selected.has:after{background:white}.preview{font-size:11px;background:#e9efff;color:#3666bf;border-radius:30px;padding:7px 11px;font-weight:700}.note{font-size:12px;color:#8c99ab;line-height:1.6}.hidden{display:none!important}</style></head><body><main><header class="top"><div><div class="eyebrow">YOUR PERSONAL SPACE</div><h1>My Planner</h1><p>把每一天，安排得刚刚好。</p></div><button class="avatar" onclick="alert('预览版：设置与登录将在正式版接入')">⚙️</button></header><div class="preview">双页面交互预览 · 不会修改真实任务</div>
<section id="tasks" class="page active"><div class="card hero" style="margin-top:18px"><div class="muted">今天 · 11月7日 星期六</div><h2>今天有 3 项任务</h2><div class="muted">完成 1 项 · 继续加油</div><div class="bar"><i></i></div></div><div class="section"><h2>今日任务</h2><span>查看全部</span></div><div class="card"><div class="task"><button class="check" onclick="toggle(this)"></button><div><strong>上厕所</strong><small>⏰ 13:36 · 中优先级</small></div><span class="pill">待办</span></div><div class="task"><button class="check" onclick="toggle(this)"></button><div><strong>睡觉</strong><small>⏰ 13:38 · 中优先级</small></div><span class="pill">待办</span></div><div class="task"><button class="check" onclick="toggle(this)"></button><div><strong>看手机</strong><small>⏰ 13:35 · 中优先级</small></div><span class="pill">待办</span></div><button class="add" onclick="alert('预览版：正式版将连接真实任务添加功能')">＋ 添加任务</button></div><div class="section"><h2>长期任务</h2><span>查看全部 ›</span></div><div class="card"><span class="muted">长期计划将在这里显示</span></div></section>
<section id="calendar" class="page"><div class="card" style="margin-top:18px"><div class="calendarhead"><h2 id="month">2026年11月</h2><div class="arrows"><button onclick="changeMonth(-1)">‹</button><button onclick="changeMonth(1)">›</button></div></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days" id="days"></div><p class="note">🟠 小圆点表示有任务 · 点击日期查看安排</p></div><div class="section"><h2 id="dateTitle">11月7日的任务</h2><span>日程安排</span></div><div class="card" id="dayTasks"><div class="task"><span>⏰</span><div><strong>上厕所</strong><small>13:36</small></div></div><div class="task"><span>⏰</span><div><strong>睡觉</strong><small>13:38</small></div></div><div class="task"><span>⏰</span><div><strong>看手机</strong><small>13:35</small></div></div></div></section></main><nav class="nav"><button class="active" data-page="tasks" onclick="switchPage('tasks')">☑️ 任务</button><button data-page="calendar" onclick="switchPage('calendar')">▦ 日历</button></nav><script>
function switchPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));window.scrollTo(0,0)}
function toggle(b){b.style.background=b.style.background?'':'#2866ec';b.style.borderColor=b.style.background?'#2866ec':'';b.nextElementSibling.style.textDecoration=b.style.background?'line-through':''}
let year=2026,month=10,selected=7;function changeMonth(d){month+=d;if(month>11){month=0;year++}if(month<0){month=11;year--}selected=1;renderCalendar()}
function renderCalendar(){document.getElementById('month').textContent=year+'年'+(month+1)+'月';const grid=document.getElementById('days');grid.innerHTML='';let start=new Date(year,month,1).getDay(),len=new Date(year,month+1,0).getDate(),rows=Math.ceil((start+len)/7);for(let i=0;i<rows*7;i++){let n=i-start+1,b=document.createElement('button');b.className='day';let valid=n>=1&&n<=len;b.textContent=valid?n:(n<1?new Date(year,month,0).getDate()+n:n-len);if(!valid)b.classList.add('other');if(valid&&n===selected)b.classList.add('selected');if(valid&&year===2026&&month===10&&n===7)b.classList.add('has');b.onclick=()=>{if(!valid)return;selected=n;renderCalendar()};grid.appendChild(b)}document.getElementById('dateTitle')=(month+1)+'月'+selected+'日的任务';document.getElementById('dayTasks').innerHTML=year===2026&&month===10&&selected===7?'<div class="task">⏰　上厕所 · 13:36</div><div class="task">⏰　睡觉 · 13:38</div><div class="task">⏰　看手机 · 13:35</div>':'<span class="muted">这一天暂无任务（预览数据）</span>'}renderCalendar();
</script></body></html>
